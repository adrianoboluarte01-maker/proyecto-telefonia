<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="nav-contenedor">
            <div class="logo">COMPAÑIA TELEFÓNICA<span></span></div>
            <nav>
                <ul>
                    <li class="activo">Servicios</li>
                    <li>Tienda</li>
                    <li>Ayuda</li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <div class="acceso-sesion" id="acceso-sesion">
            <h2>Portal</h2>
            <p>Ingresa tus credenciales para gestionar tus servicios</p>

            <form action="{{ url_for('login') }}" method="POST">
                
                <div class="grupo-entrada">
                    <label for="usuario">Usuario o Correo</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej. Mikolas" required>
                </div>

                <div class="grupo-entrada">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div id="mensaje" class="mensaje-alerta" style="color: #da291c;">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {{ messages[0] }}
                        {% endif %}
                    {% endwith %}
                </div>

                <button type="submit" id="btnValidar">Validar</button>
            </form>
        </div>
    </main>

</body>
</html>
